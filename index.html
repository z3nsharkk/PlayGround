<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101225">
<title>Haru's Heart Race — fan battle</title>
<style>
:root{color-scheme:dark;--cream:#fff2dc;--gold:#ffd86d;--pink:#ff789e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101225;color:var(--cream);font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}body{min-height:100svh;display:flex;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 0%,#292542,#141629 48%,#0d1020)}.app{width:min(100%,1000px);margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 auto 10px;padding:0 4px;color:#b9b8cb;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.brand{display:flex;align-items:center;gap:9px;color:#fff1d2;font-weight:900;letter-spacing:.08em}.mark{width:18px;height:18px;transform:rotate(45deg);background:linear-gradient(135deg,#ff8dac,#ffcf70);border:2px solid #fff1d2;box-shadow:0 0 16px #ff779d70}.fan{color:#8d8ba5;font-size:10px;text-align:right}.screen{border:2px solid #f5e9d8;background:#0b0c18;box-shadow:0 0 0 5px #29273b,0 18px 60px #0008;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;touch-action:none}.under{display:flex;justify-content:space-between;align-items:center;color:#a5a4b9;font-size:11px;margin:13px 3px 0;gap:14px}.under strong{color:#ffe19a}.reset{border:1px solid #514d69;border-radius:999px;background:#1b1b2c;padding:7px 12px;color:#d5d0df;font:inherit;font-size:11px;cursor:pointer}.reset:hover{border-color:var(--gold);color:white}.mobile{display:none;align-items:center;justify-content:space-between;gap:20px;margin:17px auto 0;max-width:540px;user-select:none;touch-action:none}.joy{width:142px;height:142px;position:relative;border-radius:50%;background:radial-gradient(circle,#26243a,#171727);border:2px solid #514b68;box-shadow:inset 0 0 0 8px #ffffff08}.joy:before,.joy:after{content:"";position:absolute;background:#77718e44}.joy:before{width:1px;height:100%;left:50%}.joy:after{height:1px;width:100%;top:50%}.nub{position:absolute;width:52px;height:52px;left:43px;top:43px;border-radius:50%;background:linear-gradient(145deg,#8a819f,#514a68);border:2px solid #bdb1c8;box-shadow:0 4px 10px #0008;pointer-events:none}.buttons{display:grid;grid-template-columns:repeat(2,62px);grid-template-rows:repeat(2,62px);gap:10px;transform:rotate(-8deg)}.action{border-radius:50%;border:2px solid #ffe3e8;background:linear-gradient(145deg,#ff8ca9,#bf496c);color:white;font:900 19px inherit;font-family:inherit;font-size:20px;box-shadow:0 5px 0 #73344c,0 8px 18px #0008;touch-action:none}.action:nth-child(2){background:linear-gradient(145deg,#9aa5d2,#515a8e);border-color:#e4e6ff;box-shadow:0 5px 0 #303555,0 8px 18px #0008}.action:nth-child(3){background:linear-gradient(145deg,#f7d17c,#bc8642);border-color:#fff1ce;box-shadow:0 5px 0 #765329,0 8px 18px #0008}.action:active{transform:translateY(4px);box-shadow:none}.mobile-note{display:none;color:#9693ab;text-align:center;font-size:10px;margin-top:8px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-width:680px),(pointer:coarse){body{padding:10px 12px;align-items:flex-start}.topline{font-size:10px;margin-bottom:8px}.fan{max-width:135px}.under{font-size:10px}.mobile{display:flex}.mobile-note{display:block}.app{margin:0 auto}}@media(max-width:390px){.mobile{gap:12px}.joy{width:128px;height:128px}.nub{left:36px;top:36px}.buttons{grid-template-columns:repeat(2,56px);grid-template-rows:repeat(2,56px);gap:9px}.action{font-size:18px}}
</style>
</head>
<body><main class="app"><header class="topline"><div class="brand"><i class="mark"></i> STARFALL ARENA</div><div class="fan">A tiny fan-made boss battle<br>for the love of the long shot ♡</div></header><div class="screen"><canvas id="game" width="960" height="640" aria-label="Haru Urara boss fight game"></canvas></div><div class="under"><span><strong>ARROWS</strong> move · <strong>Z</strong> confirm · <strong>X</strong> back · <strong>C</strong> menu</span><button class="reset" id="reset">↻ Restart fight</button></div><section class="mobile" aria-label="Touch controls"><div class="joy" id="joy" aria-label="Movement joystick"><div class="nub" id="nub"></div></div><div class="buttons"><button class="action" data-key="z" aria-label="Z confirm">Z</button><button class="action" data-key="x" aria-label="X back">X</button><button class="action" data-key="c" aria-label="C menu">C</button></div></section><div class="mobile-note">Drag the joystick to move · tap Z / X / C</div></main>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=960,H=640;ctx.imageSmoothingEnabled=false;
const C={cream:'#fff2dc',gold:'#ffd86d',pink:'#ff789e',red:'#ff4f68',dark:'#101225',muted:'#aaa8be',purple:'#8f83ba'};
let state='intro',line=0,menu=0,sub=0,sublist=[],hp=20,maxHp=20,enemyHp=100,kindness=0,turn=0,dialogue=['A pink blur skids to a stop.','Haru Urara beams at you!','“Let’s make this the best race ever!”'],floating='',floatT=0,bullets=[],heart={x:480,y:394,r:8,inv:0},elapsed=0,phase=0,attackTime=0,attackLength=0,damageTimer=0,invuln=0,beat=0,winText='',pressed=new Set(),joyVec={x:0,y:0},last=performance.now(),shake=0,audio=null;
const menuNames=['FIGHT','ACT','ITEM','MERCY'];
function reset(){state='intro';line=0;menu=0;sub=0;hp=20;enemyHp=100;kindness=0;turn=0;dialogue=['A pink blur skids to a stop.','Haru Urara beams at you!','“Let’s make this the best race ever!”'];floating='';floatT=0;bullets=[];heart={x:480,y:394,r:8,inv:0};invuln=0;shake=0;}
function sound(freq=440,dur=.07,type='square'){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function text(s,x,y,size=20,color=C.cream,align='left'){ctx.font=`${size}px ui-monospace,Consolas,monospace`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y)}function wrapText(s,max=42){let words=String(s).split(/\s+/),lines=[],line='';for(let word of words){if(line&&`${line} ${word}`.length>max){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line);return lines}function outline(x,y,w,h,color=C.cream,lw=3){ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h)}function heartDraw(x,y,size,color=C.red){ctx.save();ctx.translate(x,y);ctx.scale(size/18,size/18);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,7);ctx.bezierCurveTo(-15,-2,-9,-12,0,-6);ctx.bezierCurveTo(9,-12,15,-2,0,7);ctx.fill();ctx.restore()}
const stars=Array.from({length:80},(_,i)=>({x:(i*137+31)%960,y:(i*83+19)%285,r:i%5===0?2:1,tw:i*.73}));
function background(){rect(0,0,W,H,'#0c0d19');let g=ctx.createRadialGradient(480,180,25,480,200,600);g.addColorStop(0,'#2a2440');g.addColorStop(1,'#0d1020');ctx.fillStyle=g;ctx.fillRect(0,0,W,330);for(let s of stars){let a=.25+.45*(.5+.5*Math.sin(elapsed*1.6+s.tw));rect(s.x,s.y,s.r,s.r,`rgba(255,230,190,${a})`)}rect(0,276,W,3,'#635273');rect(0,279,W,31,'#20192d');for(let i=0;i<30;i++){let x=i*36+((i%3)*7);rect(x,287,18,4,'#42334c');rect(x+5,296,22,3,'#3a2f47')}rect(0,310,W,330,'#0e101d');}
function horseGirl(){let bob=Math.sin(elapsed*5)*3,x=480,y=166+bob;ctx.save();ctx.translate(x,y);
// tail and ears
rect(-44,28,12,44,'#842d58');rect(-55,52,16,14,'#bd4775');rect(-48,66,21,10,'#ed7092');rect(-25,-55,13,35,'#542848');rect(13,-57,13,37,'#542848');rect(-23,-58,9,24,'#ed7494');rect(15,-60,9,24,'#ed7494');
// legs, boots
rect(-20,83,15,45,'#f1bfd0');rect(8,83,15,45,'#f1bfd0');rect(-23,119,22,12,'#71314e');rect(8,119,22,12,'#71314e');rect(-25,131,25,7,'#f7d17c');rect(8,131,26,7,'#f7d17c');
// jacket silhouette
rect(-37,5,74,79,'#ee6d97');rect(-43,23,14,55,'#ee6d97');rect(29,23,14,55,'#ee6d97');rect(-35,71,70,17,'#f3c7d2');rect(-15,8,30,70,'#fff0d9');rect(-6,13,13,51,'#e0ad55');rect(-33,13,11,15,'#ffd86d');rect(23,13,11,15,'#ffd86d');
// face and hair
rect(-30,-39,60,48,'#ffd9bd');rect(-36,-32,13,31,'#f1c0aa');rect(23,-33,13,32,'#f1c0aa');rect(-34,-46,68,24,'#a93567');rect(-38,-40,14,34,'#a93567');rect(24,-40,14,36,'#a93567');rect(-24,-16,48,10,'#a93567');rect(-17,-31,6,9,'#432942');rect(12,-31,6,9,'#432942');rect(-14,-18,28,3,'#dc6476');rect(-31,-49,19,12,'#ed78a0');rect(16,-49,18,12,'#ed78a0');rect(-4,-6,9,5,'#fff1d5');
// bow
rect(-6,-62,21,12,'#ffd86d');rect(0,-67,8,9,'#fff0bd');
ctx.restore();
// name sparkle
if(state==='intro'){heartDraw(554,116,14,'#ffb4c9');text('♪',405,113,22,'#ffda79');}}
function status(){text('YOU · LV 1',68,33,16,C.cream);text('HP',68,65,13,C.cream);rect(98,59,96,12,'#632e46');rect(98,59,96*Math.max(0,hp/maxHp),12,'#f16a79');outline(98,59,96,12,'#fff0d8',1);text(`${hp}/${maxHp}`,205,65,13,C.cream);text('HARU URARA',480,35,19,'#ffb4c9','center');text('HP',760,35,18,C.cream);rect(803,26,100,17,'#632e46');rect(803,26,100*Math.max(0,enemyHp/100),17,'#ffb05e');outline(803,26,100,17,'#fff0d8',2);text(`${Math.ceil(enemyHp)} / 100`,853,57,13,C.cream,'center');}
function box(x,y,w,h){rect(x,y,w,h,'#090a12');outline(x,y,w,h,C.cream,3)}
function drawBattleBox(){box(245,304,470,180);if(state==='enemy'){heartDraw(heart.x,heart.y,18,C.red);for(let b of bullets){if(b.type==='star'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot||0);text('✦',0,0,23,'#ffd86d','center');ctx.restore()}else if(b.type==='horseshoe'){text('⌒',b.x,b.y,26,'#ffad72','center')}else heartDraw(b.x,b.y,15,b.color||'#ff758b')}}else if(state==='fight'){rect(270,362,420,14,'#493044');rect(270,362,420*enemyHp/100,14,'#dd667d');outline(270,362,420,14,C.cream,2);rect(478,342,4,54,'#fff1dc');let mx=278+(Math.sin(attackTime*4)+1)*204;rect(mx,348,9,42,C.gold);text('PRESS Z NEAR THE CENTER!',480,425,14,C.muted,'center')}else if(['intro','talk','result','win','lose','menu','submenu','mercy'].includes(state)){let message=state==='intro'?dialogue[line]||'':state==='talk'||state==='result'?dialogue[0]:state==='win'?winText:state==='lose'?'Your heart slows. But every race has another lap.':state==='menu'?'Haru bounces on her toes, ready for another lap.':state==='submenu'?'What would you like to do?':'The finish line is behind her. Haru is all smiles.';let lines=wrapText(message,38).slice(0,5);text('♥',269,348,20,C.red);lines.forEach((line,i)=>text(line,490,338+i*25,17,C.cream,'center'));if(['intro','talk','result','win','lose'].includes(state))text('Z  NEXT',684,463,12,'#8e899f','right')}}
function drawMenu(){if(state==='enemy'||state==='fight'||state==='win'||state==='lose')return;box(95,510,770,105);if(state==='intro'||state==='talk'||state==='result'){text('Z  CONTINUE',830,589,14,C.gold,'right');return}if(state==='submenu'){text(sublist[sub]||'',145,548,19,C.cream);text('X BACK',830,589,13,C.muted,'right');return}if(state==='mercy'){text('Spare Haru?',145,548,19,C.cream);text('Z YES     X NOT YET',830,589,14,C.gold,'right');return}if(state==='fight'){return}const xs=[146,345,545,745];for(let i=0;i<4;i++){let selected=i===menu;let color=selected?C.gold:C.cream;if(selected)heartDraw(xs[i]-44,548,15,C.red);text(menuNames[i],xs[i],548,22,color,'center');}text('Haru bounces on her toes.',480,584,13,'#aaa8be','center');}
function draw(){background();status();horseGirl();drawBattleBox();drawMenu();if(floating&&floatT>0){text(floating,480,250,17,C.gold,'center')}if(shake>0){/* shake is applied to player only */}}
function chooseMenu(){let item=menuNames[menu];sound(520,.05);if(item==='FIGHT'){state='fight';attackTime=0;return}if(item==='ACT'){sublist=['Cheer her on','Ask about her dream','Race her to the line'];sub=0;state='submenu';return}if(item==='ITEM'){sublist=hp<maxHp?['Strawberry shortcake  +8 HP','Pocket carrot  +5 HP']:['Your bag is empty.'];sub=0;state='submenu';return}if(item==='MERCY'){if(kindness>=3){state='mercy'}else{state='talk';dialogue=[`Haru still wants to race! (${kindness}/3 heart-to-hearts)`]}return}}
function selectSub(){let item=sublist[sub];if(menu===1){if(sub===0){kindness++;dialogue=['You cheer with all your heart.','Haru’s ears perk up! Her smile shines brighter.']}else if(sub===1){kindness++;dialogue=['You ask what keeps her running.','“Because I believe I can make someone smile!”']}else{kindness+=2;dialogue=['You challenge Haru to a friendly sprint.','She takes off, then circles back laughing!']};state='result';endTalk()}else if(menu===2){if(hp<maxHp&&(sub===0||sub===1)){let heal=sub===0?8:5;hp=Math.min(maxHp,hp+heal);dialogue=[`You share a ${sub===0?'strawberry shortcake':'pocket carrot'}.`,`HP restored by ${heal}! Haru says it looks delicious.`];sublist=['Your bag is empty.'];state='result';endTalk()}else{dialogue=['You rummage around.','Nothing left in your bag!'];state='result';endTalk()}}}
function endTalk(){kindness=Math.min(3,kindness);floatT=0;}
function startEnemy(){state='enemy';turn++;attackTime=0;bullets=[];heart.x=480;heart.y=394;attackLength=5.8;phase=turn%3;for(let i=0;i<8;i++){let delay=.45+i*.58;if(phase===0)bullets.push({x:i%2?730:-10,y:334+(i%4)*38,vx:i%2?-205:205,vy:0,delay,type:i%3===0?'star':'heart'});else if(phase===1)bullets.push({x:285+i*55,y:300,vx:(i-3.5)*16,vy:118+(i%3)*17,delay,type:i%3===0?'horseshoe':'heart'});else bullets.push({x:480,y:300,vx:Math.cos(i*Math.PI/4)*155,vy:Math.sin(i*Math.PI/4)*135+45,delay,type:i%2?'heart':'star'});}dialogue=[];}
function nextAfterResult(){if(kindness>=3){state='menu'}else startEnemy()}
function hurt(){if(invuln>0)return;hp-=2;invuln=1.05;shake=.18;sound(115,.12,'sawtooth');if(hp<=0){hp=0;state='lose';}}
function update(dt){elapsed+=dt;if(floatT>0)floatT-=dt;if(invuln>0)invuln-=dt;if(heart.inv>0)heart.inv-=dt;if(shake>0)shake-=dt;if(state==='enemy'){attackTime+=dt;let speed=235;let dx=(pressed.has('ArrowRight')||pressed.has('d')?1:0)-(pressed.has('ArrowLeft')||pressed.has('a')?1:0)+joyVec.x;let dy=(pressed.has('ArrowDown')||pressed.has('s')?1:0)-(pressed.has('ArrowUp')||pressed.has('w')?1:0)+joyVec.y;let m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}heart.x=Math.max(258,Math.min(702,heart.x+dx*speed*dt));heart.y=Math.max(318,Math.min(470,heart.y+dy*speed*dt));for(let b of bullets){b.delay-=dt;if(b.delay<=0){b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot=(b.rot||0)+dt*2;if(Math.hypot(b.x-heart.x,b.y-heart.y)<(b.type==='star'?14:13))hurt()}}bullets=bullets.filter(b=>b.x>220&&b.x<740&&b.y>288&&b.y<500);if(attackTime>attackLength){state='talk';dialogue=['Haru catches her breath. “You’re amazing at dodging!”'];}}
if(state==='fight')attackTime+=dt;}
function keyDown(key){if(pressed.has(key))return;pressed.add(key);if(key==='Escape'){}let k=key.toLowerCase();if(k==='z'||k==='enter'||k===' '){sound(620,.045);if(state==='intro'){line++;if(line>=dialogue.length){state='menu';line=0}}else if(state==='menu')chooseMenu();else if(state==='submenu')selectSub();else if(state==='mercy'){state='win';winText='Haru gives you a high five. The best race is the one you run together!';sound(760,.25,'triangle')}else if(state==='fight'){let accuracy=1-Math.min(1,Math.abs((278+(Math.sin(attackTime*4)+1)*204+4-488)/210));let dmg=Math.round(12+accuracy*22);enemyHp=Math.max(0,enemyHp-dmg);if(enemyHp===0){state='win';winText='Haru laughs and calls it a photo finish. Your friendship is the real prize!'}else{dialogue=[accuracy>.8?'Bullseye! Haru spins around, grinning.':'You tap Haru’s shoulder. She giggles!'];kindness=Math.min(3,kindness+1);state='talk'}}else if(state==='talk'||state==='result'){nextAfterResult()}else if(state==='lose'){reset()}}
else if(k==='x'||k==='escape'){if(state==='submenu'){state='menu'}else if(state==='mercy'){state='menu'}else if(state==='menu'){menu=0;sound(300,.04)}else if(state==='intro'){if(line>0)line--}}
else if(k==='c'){if(state==='menu'){menu=(menu+1)%4;sound(380,.04)}else if(state==='submenu')sub=(sub+1)%Math.max(1,sublist.length);else if(state==='talk'||state==='result'){nextAfterResult()}}
else if(state==='menu'&&(k==='arrowleft'||k==='arrowright')){menu=(menu+(k==='arrowright'?1:3))%4;sound(400,.03)}else if(state==='submenu'&&(k==='arrowup'||k==='arrowdown')){sub=(sub+(k==='arrowdown'?1:sublist.length-1))%sublist.length;sound(400,.03)}else if(state==='mercy'&&k==='arrowleft'){state='menu'} }
function keyUp(key){pressed.delete(key)}
window.addEventListener('keydown',e=>{let k=e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();keyDown(k)});window.addEventListener('keyup',e=>keyUp(e.key));window.addEventListener('blur',()=>pressed.clear());
document.querySelector('#reset').addEventListener('click',reset);
document.querySelectorAll('.action').forEach(button=>{let k=button.dataset.key;button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keyDown(k)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(ev,e=>{e.preventDefault();keyUp(k)})});
const joy=document.querySelector('#joy'),nub=document.querySelector('#nub');let joyPointer=null;
function joyMove(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=(e.clientX-cx)/(r.width*.34),dy=(e.clientY-cy)/(r.height*.34),d=Math.hypot(dx,dy);if(d>1){dx/=d;dy/=d}joyVec={x:dx,y:dy};nub.style.transform=`translate(${dx*35}px,${dy*35}px)`}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(joyPointer===e.pointerId)joyMove(e)});function joyEnd(){joyPointer=null;joyVec={x:0,y:0};nub.style.transform=''}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);joy.addEventListener('lostpointercapture',joyEnd);
function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
